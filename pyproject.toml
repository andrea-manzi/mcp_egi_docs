[project]
name = "mcp-egi-docs"
version = "0.1.0"
description = "MCP server that serves the EGI documentation (docs.egi.eu)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.scripts]
mcp-egi-docs = "mcp_egi_docs.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
